# Local stack: Postgres, MongoDB, MinIO, this API, the tutor (code-x-ai)
# and Ollama. Clone code-x-ai next to this repo (or set TUTOR_PATH), copy
# .env.example to .env in both repos, then run: docker compose up --build
# Every port is bound to 127.0.0.1 only.
name: codex

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: codex
      POSTGRES_DB: codex
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codex']
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - '127.0.0.1:27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      retries: 10

  # The official minio/minio image is no longer on Docker Hub; this is the
  # last Bitnami build of MinIO, which also creates the bucket on start.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-codex}
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      target: development
    env_file: .env
    # Service hostnames inside the compose network override .env.
    environment:
      PORT: '8000'
      DATABASE_URL: postgresql://codex:codex@postgres:5432/codex?schema=public
      MONGO_URL: mongodb://mongo:27017
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      TUTOR_URL: http://tutor:80
    command: sh -c "npx prisma migrate deploy && yarn seed && yarn start:dev"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '127.0.0.1:${PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy

  tutor:
    build:
      context: ${TUTOR_PATH:-../code-x-ai}
    env_file: ${TUTOR_PATH:-../code-x-ai}/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      OLLAMA_URL: http://ollama:11434
    ports:
      - '127.0.0.1:8001:80'
    depends_on:
      mongo:
        condition: service_healthy

  # Local model server for the MVP. Needs the NVIDIA Container Toolkit; on
  # a machine without an NVIDIA GPU, delete the deploy block to run on CPU.
  ollama:
    image: ollama/ollama:0.12.3
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - '127.0.0.1:11434:11434'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres-data:
  mongo-data:
  minio-data:
  ollama-data:
